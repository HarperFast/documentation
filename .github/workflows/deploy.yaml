name: Deploy

# Builds the site from main once and deploys that build to the production Harper Fabric cluster, which
# serves https://docs.harper.fast, and to GitHub Pages.
#
# The Fabric deploy uses HarperFast/deploy-action and authenticates with OIDC only.
# `harper deploy setup=true provider=github-actions project=docs-site`, run as a super_user from a
# checkout of this repository, wrote the trust policy `github-actions-docs-site`, which matches only
# this file on main in the `production` environment, and set the HARPER_CLI_TARGET variable. See https://github.com/HarperFast/deploy-action#deploy-on-merge
#
# The build runs MDX assembled from harper and harper-pro, so it runs in a job with no identity
# token. The deploy jobs run none of the repository's code: they deploy the build's artifact.

on:
  push:
    branches:
      - main
    paths:
      - 'reference_versioned_docs/**'
      - 'reference_versioned_sidebars/**'
      - 'reference_versions.json'
      - 'fabric/**'
      - 'learn/**'
      - 'release-notes/**'
      - 'src/**'
      - 'static/**'
      - 'docusaurus.config.ts'
      - 'package-lock.json'
      - 'package.json'
      - 'historic-redirects.ts'
      - 'redirects.ts'
      - 'sidebars*.ts'
      - 'scripts/assemble-content.mjs'
      - 'scripts/generateReleaseNotesData.js'
      - 'scripts/prebuild.js'
      - 'scripts/rehype-docusaurus-to-llms.mjs'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    # A newer commit's build replaces this one; a deploy already started is never cancelled.
    concurrency:
      group: production-build
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: |
          echo "Installing dependencies from $(pwd)"
          npm ci || (echo "npm ci failed, uploading logs" && exit 1)

      - name: Build Docusaurus site
        env:
          # The assembler reads HarperFast/harper-pro releases; unauthenticated calls share a per-IP limit.
          GH_TOKEN: ${{ github.token }}
          DOCUSAURUS_BASE_URL: ${{ vars.DOCUSAURUS_BASE_URL }}
          DOCUSAURUS_URL: ${{ vars.DOCUSAURUS_URL }}
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_SEARCH_KEY: ${{ secrets.ALGOLIA_SEARCH_KEY }}
          ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}
          GA4_TRACKING_ID: ${{ secrets.GA4_TRACKING_ID }}
        run: |
          echo "Building Docusaurus site..."
          echo "Using DOCUSAURUS_BASE_URL: $DOCUSAURUS_BASE_URL"
          echo "Using DOCUSAURUS_URL: $DOCUSAURUS_URL"
          npm run build || (echo "Site build failed" && exit 1)

      - name: Verify flat-markdown export
        run: |
          # @signalwire/docusaurus-plugin-llms-txt should have produced one
          # .md file per HTML page plus an llms.txt index. This artifact is
          # consumed by @harperfast/skills (and any third-party LLM tooling).
          # Fail the build loudly if it didn't run or produced no output.
          set -euo pipefail
          failures=0
          for dir in learn reference fabric release-notes; do
            count=$(find "build/$dir" -name '*.md' 2>/dev/null | wc -l | tr -d ' ')
            if [ "$count" -lt 1 ]; then
              echo "::error::No .md files generated under build/$dir/ — llms-txt plugin failed for this docs instance"
              failures=$((failures + 1))
            else
              echo "build/$dir: $count .md files"
            fi
          done
          for f in build/llms.txt build/llms-full.txt; do
            if [ ! -f "$f" ]; then
              echo "::error::Expected artifact $f is missing"
              failures=$((failures + 1))
            fi
          done
          if [ "$failures" -gt 0 ]; then
            exit 1
          fi
          echo "✓ Flat-markdown export verified"

      # A harper or harper-pro release deploys without a PR here, so this is its only check.
      - name: Check for removed pages
        env:
          SITE_URL: ${{ vars.DOCUSAURUS_URL }}${{ vars.DOCUSAURUS_BASE_URL || '/' }}
        run: npm run check:removed-pages

      - name: Upload npm logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-logs
          path: |
            ~/.npm/_logs/

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build

  fabric:
    needs: build
    name: Deploy to Harper Fabric
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ vars.DOCUSAURUS_URL }}
    # Deploys queue rather than cancel: a rolling restart stopped partway leaves nodes on different releases.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
    steps:
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages

      # upload-pages-artifact stores the site as artifact.tar.
      - name: Serve the build as a Harper application
        run: |
          mkdir -p site/build
          tar -xf artifact.tar -C site/build
          cat > site/config.yaml << 'EOF'
          static:
            files: 'build/**'
            urlPath: '/'
            extensions: ['html']
            index: true
          EOF

      # Restarts the cluster's nodes one at a time and waits until every node has taken the release.
      - uses: HarperFast/deploy-action@45fa59b6157eabb72b7a74922309238671f2a37d # v1.0.0
        with:
          target: ${{ vars.HARPER_CLI_TARGET }}
          app: docs-site
          path: site

      - name: Smoke-test deployment
        env:
          SITE_URL: ${{ vars.DOCUSAURUS_URL }}
        run: |
          curl --silent --fail --show-error --location \
            --retry 10 --retry-delay 6 --retry-all-errors \
            "$SITE_URL/" | grep -qi '<html' \
            && echo "✓ Site root responding with HTML"

  pages:
    needs: build
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # Notify the skills repo that docs changed, so it can regenerate its
  # docs-driven rules against the just-deployed content. See the
  # generate.yaml workflow in HarperFast/skills (Phase 2 of the
  # docs-driven-skills plan).
  #
  # Authenticates as the org-owned "harper-skills-sync" GitHub App, minting
  # a token scoped to HarperFast/skills (the default GITHUB_TOKEN is scoped
  # to this repo only and cannot dispatch cross-repo). The App must be
  # installed on the skills repo; this repo holds its SKILLS_SYNC_APP_ID /
  # SKILLS_SYNC_APP_PRIVATE_KEY secrets. If the App is ever removed, the
  # skills repo's weekly cron is the safety net.
  notify-skills:
    needs: [fabric, pages]
    name: Notify skills repo
    runs-on: ubuntu-latest
    steps:
      - name: Mint app token for skills
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SKILLS_SYNC_APP_ID }}
          private-key: ${{ secrets.SKILLS_SYNC_APP_PRIVATE_KEY }}
          owner: HarperFast
          repositories: skills

      - name: Dispatch docs-updated to HarperFast/skills
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/HarperFast/skills/dispatches \
            -f event_type=docs-updated \
            -F client_payload[sha]=${{ github.sha }}
