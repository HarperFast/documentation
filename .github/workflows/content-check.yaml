name: Content Check

# The v5 reference and the open release notes are assembled from docs/ in HarperFast/harper and
# HarperFast/harper-pro (scripts/assemble-content.mjs), and their merges cannot trigger this
# repo's workflows. This redeploys both sites when either repo's docs/ tree on main differs from
# the one the live site was built from (/content-sources.json). A separate workflow, so checks
# that find nothing to do never join the deploy concurrency groups.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check:
    name: Compare docs/ trees with the deployed site
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the deploys when a source changed
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL: ${{ vars.DOCUSAURUS_URL }}${{ vars.DOCUSAURUS_BASE_URL || '/' }}
        run: |
          set -euo pipefail
          # Until a running deploy publishes, the live manifest still names the old trees; dispatching
          # again would cancel it (deploy.yaml cancels in progress) and could never let one finish.
          for workflow in deploy.yaml deploy-fabric.yaml; do
            for status in queued in_progress; do
              if [ -n "$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --status "$status" --json databaseId --jq '.[].databaseId')" ]; then
                echo "$workflow has a $status run; checking again next tick"
                exit 0
              fi
            done
          done
          # The query string bypasses the Pages CDN cache, so a deploy that just finished is seen.
          deployed=$(curl -fsS "${SITE_URL%/}/content-sources.json?t=$(date +%s)" || echo '{}')
          changed=false
          for repo in harper harper-pro; do
            current=$(gh api "repos/HarperFast/$repo/git/trees/main" --jq '.tree[] | select(.path == "docs") | .sha')
            live=$(jq -r --arg repo "$repo" '.[$repo].docsTree // ""' <<<"$deployed")
            if [ "$current" != "$live" ]; then
              echo "$repo docs/ is $current; the live site was built from ${live:-unknown}"
              changed=true
            fi
          done
          if [ "$changed" = true ]; then
            gh workflow run deploy.yaml --repo "$GITHUB_REPOSITORY" --ref main
            gh workflow run deploy-fabric.yaml --repo "$GITHUB_REPOSITORY" --ref main
          fi
